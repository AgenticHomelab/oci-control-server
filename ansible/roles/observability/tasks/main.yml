---
- name: Validate supported host and bounded configuration
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '26.04'
      - ansible_facts['architecture'] == 'aarch64'
      - ansible_facts['service_mgr'] == 'systemd'
      - observability_retention is match('^[1-9][0-9]*d$')
      - observability_vm_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - observability_vm_archive_sha256 is match('^[a-f0-9]{64}$')
      - observability_grafana_deb_sha256 is match('^[a-f0-9]{64}$')
      - observability_grafana_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - observability_grafana_build is match('^[0-9]+$')
      - observability_instance is match('^[a-zA-Z0-9._-]+$')
      - observability_grafana_password_file == '/etc/oci-control-server/grafana/admin-password'

- name: Inspect bootstrap parent directory
  ansible.builtin.stat:
    path: /etc/oci-control-server
    follow: false
    get_checksum: false
    get_mime: false
  register: observability_bootstrap_parent

- name: Require root-owned bootstrap parent
  ansible.builtin.assert:
    that:
      - observability_bootstrap_parent.stat.isdir | default(false)
      - not (observability_bootstrap_parent.stat.islnk | default(true))
      - observability_bootstrap_parent.stat.pw_name | default('') == 'root'
      - observability_bootstrap_parent.stat.gr_name | default('') == 'root'
      - observability_bootstrap_parent.stat.mode | default('') == '0755'

- name: Inspect operator bootstrap directory without reading credentials
  ansible.builtin.stat:
    path: /etc/oci-control-server/grafana
    follow: false
    get_checksum: false
    get_mime: false
  register: observability_bootstrap_dir

- name: Require protected bootstrap directory
  ansible.builtin.assert:
    that:
      - observability_bootstrap_dir.stat.isdir | default(false)
      - not (observability_bootstrap_dir.stat.islnk | default(true))
      - observability_bootstrap_dir.stat.pw_name | default('') == 'root'
      - observability_bootstrap_dir.stat.gr_name | default('') == 'grafana'
      - observability_bootstrap_dir.stat.mode | default('') == '0750'
    fail_msg: Prepare the protected Grafana bootstrap directory as documented before apply.

- name: Inspect operator bootstrap files without reading credentials
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - "{{ observability_grafana_password_file }}"
    - /etc/oci-control-server/grafana/secret-key
  register: observability_bootstrap

- name: Require protected operator bootstrap before installing packages
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(true))
      - item.stat.pw_name | default('') == 'root'
      - item.stat.gr_name | default('') == 'grafana'
      - item.stat.mode | default('') == '0640'
      - item.stat.nlink | default(0) == 1
      - item.stat.size | default(0) >= 24
    fail_msg: Prepare protected Grafana bootstrap files as documented before apply.
  loop: "{{ observability_bootstrap.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install repository prerequisites without starting package services
  ansible.builtin.apt:
    name: [ca-certificates, apt-transport-https]
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Create scoped APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install checksum-pinned official Grafana repository key
  ansible.builtin.get_url:
    timeout: 60
    url: https://apt.grafana.com/gpg-full.key
    checksum: "sha256:{{ observability_grafana_key_sha256 }}"
    dest: /etc/apt/keyrings/observability-grafana.asc
    owner: root
    group: root
    mode: "0644"
  register: observability_download_0
  until: observability_download_0 is succeeded
  retries: 3
  delay: 5

- name: Configure signed ARM64 Grafana repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/observability-grafana.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [arch=arm64 signed-by=/etc/apt/keyrings/observability-grafana.asc] https://apt.grafana.com stable main

- name: Pin reviewed package versions against unattended upgrades
  ansible.builtin.template:
    src: apt-preferences.j2
    dest: /etc/apt/preferences.d/observability
    owner: root
    group: root
    mode: "0644"

- name: Create versioned official Grafana package cache
  ansible.builtin.file:
    path: "/opt/grafana/{{ observability_grafana_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download patched official Grafana OSS ARM64 package
  ansible.builtin.get_url:
    timeout: 60
    url: >-
      https://dl.grafana.com/grafana/release/{{ observability_grafana_version }}/grafana_{{
      observability_grafana_version }}_{{ observability_grafana_build }}_linux_arm64.deb
    checksum: "sha256:{{ observability_grafana_deb_sha256 }}"
    dest: "/opt/grafana/{{ observability_grafana_version }}/grafana.deb"
    owner: root
    group: root
    mode: "0644"
  register: observability_download_1
  until: observability_download_1 is succeeded
  retries: 3
  delay: 5

- name: Install official Grafana OSS package through APT without auto-start
  ansible.builtin.apt:
    deb: "/opt/grafana/{{ observability_grafana_version }}/grafana.deb"
    state: present
    policy_rc_d: 101
  notify: Restart observability Grafana

- name: Install signed official Alloy package without auto-start
  ansible.builtin.apt:
    name: "alloy={{ observability_alloy_version }}"
    state: present
    update_cache: true
    policy_rc_d: 101
  notify: Restart observability Alloy

- name: Create VictoriaMetrics system group
  ansible.builtin.group:
    name: victoriametrics
    system: true

- name: Create VictoriaMetrics system identity
  ansible.builtin.user:
    name: victoriametrics
    group: victoriametrics
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/victoriametrics
    create_home: false

- name: Create versioned VictoriaMetrics installation directory
  ansible.builtin.file:
    path: "/opt/victoriametrics/{{ observability_vm_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download checksum-pinned upstream ARM64 VictoriaMetrics archive
  ansible.builtin.get_url:
    timeout: 60
    url: >-
      https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/{{
      observability_vm_version }}/victoria-metrics-linux-arm64-{{ observability_vm_version }}.tar.gz
    checksum: "sha256:{{ observability_vm_archive_sha256 }}"
    dest: "/opt/victoriametrics/{{ observability_vm_version }}/release.tar.gz"
    owner: root
    group: root
    mode: "0644"
  register: observability_download_2
  until: observability_download_2 is succeeded
  retries: 3
  delay: 5

- name: Extract versioned VictoriaMetrics binary
  ansible.builtin.unarchive:
    src: "/opt/victoriametrics/{{ observability_vm_version }}/release.tar.gz"
    dest: "/opt/victoriametrics/{{ observability_vm_version }}"
    remote_src: true
    owner: root
    group: root
    creates: "/opt/victoriametrics/{{ observability_vm_version }}/victoria-metrics-prod"

- name: Secure VictoriaMetrics executable
  ansible.builtin.file:
    path: "/opt/victoriametrics/{{ observability_vm_version }}/victoria-metrics-prod"
    owner: root
    group: root
    mode: "0755"

- name: Create owned configuration and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/victoriametrics, owner: victoriametrics, group: victoriametrics, mode: "0750"}
    - {path: /etc/grafana/provisioning/datasources, owner: root, group: grafana, mode: "0750"}
    - {path: /etc/grafana/provisioning/dashboards, owner: root, group: grafana, mode: "0750"}
    - {path: /var/lib/grafana/dashboards, owner: root, group: grafana, mode: "0750"}
    - {path: /etc/systemd/system/alloy.service.d, owner: root, group: root, mode: "0755"}
    - {path: /etc/systemd/system/grafana-server.service.d, owner: root, group: root, mode: "0755"}

- name: Configure VictoriaMetrics native systemd service
  ansible.builtin.template:
    src: victoriametrics.service.j2
    dest: /etc/systemd/system/victoriametrics.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart observability VictoriaMetrics

- name: Configure Grafana authentication and loopback listener
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart observability Grafana

- name: Provision local VictoriaMetrics datasource
  ansible.builtin.copy:
    src: datasource.yml
    dest: /etc/grafana/provisioning/datasources/control-metrics.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart observability Grafana

- name: Provision host dashboard provider
  ansible.builtin.copy:
    src: dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/control-metrics.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart observability Grafana

- name: Install declarative host overview dashboard
  ansible.builtin.copy:
    src: host-overview.json
    dest: /var/lib/grafana/dashboards/host-overview.json
    owner: root
    group: grafana
    mode: "0640"

- name: Inspect separately managed Loki integration selection
  ansible.builtin.stat:
    path: /etc/alloy/control-loki.enabled
    follow: false
    get_mime: false
    get_checksum: false
  register: observability_loki_marker

- name: Configure Alloy host metrics pipeline with upstream validation
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
    validate: /usr/bin/alloy validate %s
  notify: Restart observability Alloy

- name: Configure Alloy loopback HTTP and persistent WAL
  ansible.builtin.copy:
    dest: /etc/default/alloy
    owner: root
    group: root
    mode: "0644"
    content: |
      CONFIG_FILE=/etc/alloy/config.alloy
      CUSTOM_ARGS="--server.http.listen-addr=127.0.0.1:12345 --disable-reporting"
      ALLOY_OTEL_MODE=false
      RESTART_ON_UPGRADE=false
  notify: Restart observability Alloy

- name: Configure package service startup ordering and restart behavior
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.service.d/observability.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Wants=victoriametrics.service
      After=network-online.target victoriametrics.service
      [Service]
      Restart=on-failure
      RestartSec=5s
  loop: [alloy, grafana-server]
  notify:
    - Restart observability Grafana
    - Restart observability Alloy

- name: Apply only observability service handlers before health checks
  ansible.builtin.meta: flush_handlers

- name: Enable and start native observability services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [victoriametrics, grafana-server, alloy]

- name: Validate observability ingestion and service readiness
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode
