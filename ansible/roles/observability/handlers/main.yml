---
- name: Restart observability VictoriaMetrics
  ansible.builtin.systemd_service:
    name: victoriametrics
    daemon_reload: true
    state: restarted

- name: Restart observability Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    daemon_reload: true
    state: restarted

- name: Restart observability Alloy
  ansible.builtin.systemd_service:
    name: alloy
    daemon_reload: true
    state: restarted
