---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - acl
      - build-essential
      - ca-certificates
      - clang
      - cmake
      - curl
      - git
      - gnupg
      - jq
      - libatomic1
      - needrestart
      - libffi-dev
      - libolm-dev
      - tar
      - ubuntu-pro-client
      - unattended-upgrades
      - unzip
      - xz-utils
    state: present

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
