---
- name: Require an explicit supported dashboard credential source
  ansible.builtin.assert:
    that:
      - hermes_dashboard_secret_source in ['environment', 'oci_vault']

- name: Require Hermes dashboard credentials
  ansible.builtin.assert:
    that:
      - hermes_dashboard_username | length > 0
      - hermes_dashboard_password_hash | length > 0
      - hermes_dashboard_password_hash.startswith('scrypt$')
      - hermes_dashboard_auth_secret | length >= 16
    fail_msg: "Hermes dashboard credentials must be set in the local environment."
  no_log: true
  when:
    - hermes_dashboard_secret_source == 'environment'
    - not ansible_check_mode

- name: Write Hermes dashboard environment
  ansible.builtin.template:
    src: hermes-dashboard.env.j2
    dest: /home/hermes/.config/hermes-dashboard.env
    owner: hermes
    group: hermes
    mode: "0600"
  no_log: true
  diff: false
  register: hermes_dashboard_env
  when:
    - hermes_dashboard_secret_source == 'environment'
    - not ansible_check_mode

- name: Configure host-side dashboard Vault retrieval
  ansible.builtin.import_tasks: dashboard-vault.yml
  when: hermes_dashboard_secret_source == 'oci_vault'
