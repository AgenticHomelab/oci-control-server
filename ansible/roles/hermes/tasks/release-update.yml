---
# Ansible selects the reviewed release and verifies the outcome.
# Hermes owns its source migration, dependency updates, backups and restarts.
- name: Require the intended host and stable release pin
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'control-01'
      - hermes_release_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
      - hermes_release_version == 'v0.23.4'
    fail_msg: Only a reviewed vX.Y.Z Hermes release on control-01 is supported.

- name: Read Hermes installation source
  become_user: hermes
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /home/hermes/.hermes/hermes-agent
      - remote
      - get-url
      - origin
  register: hermes_source_remote
  changed_when: false
  check_mode: false

- name: Refuse unreviewed Hermes source repositories
  ansible.builtin.assert:
    that:
      - hermes_source_remote.stdout | trim in
        ['https://github.com/NousResearch/hermes-agent.git',
         'https://github.com/NousResearch/hermes-agent']
    fail_msg: Verify the existing Hermes checkout origin before upgrading.

- name: Check Hermes working tree
  become_user: hermes
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /home/hermes/.hermes/hermes-agent
      - status
      - --porcelain
  register: hermes_checkout_status
  changed_when: false
  check_mode: false

- name: Require a clean checkout or the identified legacy Matrix customizations
  ansible.builtin.assert:
    that:
      - >-
        (hermes_checkout_status.stdout_lines | sort) == [] or
        (hermes_checkout_status.stdout_lines | sort) ==
        ([
          ' M plugins/platforms/matrix/adapter.py',
          ' M website/docs/user-guide/messaging/matrix.md',
          '?? plugins/platforms/matrix/direct_key_delivery.py',
          '?? tests/gateway/test_matrix_direct_key_delivery.py'
        ] | sort) or
        (hermes_checkout_status.stdout_lines | sort) ==
        ([
          ' M plugins/platforms/matrix/adapter.py',
          '?? plugins/platforms/matrix/direct_key_delivery.py',
          '?? tests/gateway/test_matrix_direct_key_delivery.py'
        ] | sort)
    fail_msg: >-
      Unexpected local source changes. Review and preserve the checkout
      before updating; never discard unknown user modifications.

- name: Identify the legacy Matrix adapter and module by Git blob
  become_user: hermes
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /home/hermes/.hermes/hermes-agent
      - hash-object
      - "{{ item }}"
  loop:
    - plugins/platforms/matrix/adapter.py
    - plugins/platforms/matrix/direct_key_delivery.py
    - tests/gateway/test_matrix_direct_key_delivery.py
  register: hermes_legacy_patch_blobs
  changed_when: false
  check_mode: false
  when: hermes_checkout_status.stdout | trim != ''

- name: Read current Hermes checkout revision
  become_user: hermes
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /home/hermes/.hermes/hermes-agent
      - rev-parse
      - HEAD
  register: hermes_before_sha
  changed_when: false
  check_mode: false

- name: Refuse altered or unreviewed legacy Matrix source
  ansible.builtin.assert:
    that:
      - hermes_legacy_patch_blobs.results[1].stdout == '458e8012ba3b51da488d120fc4d951d7f6ced731'
      - >-
        ((hermes_checkout_status.stdout_lines | length) == 4 and
         hermes_before_sha.stdout | trim == '4e3fcd5cd7e40c37cb6f9a21a76fc57a7361957a' and
         hermes_legacy_patch_blobs.results[0].stdout is match('^a7d53d905f[0-9a-f]{30}$') and
         hermes_legacy_patch_blobs.results[2].stdout == '9f0165578dc9cf1de32768e060ae24d140dd4983') or
        ((hermes_checkout_status.stdout_lines | length) == 3 and
         hermes_before_sha.stdout | trim == 'e06df9c2eae6901f4c88f464e0ae6e753c0428b8' and
         hermes_legacy_patch_blobs.results[0].stdout == '628f08c69a53c66b123489471fa459125f6ec57e' and
         hermes_legacy_patch_blobs.results[2].stdout == '18c1e8b16f6e038b8ccf69f61ddd5c137d9a1fa9') or
        ((hermes_checkout_status.stdout_lines | length) == 3 and
         hermes_before_sha.stdout | trim == '8fc0374447313e276f6b9a2764bfc750190c966a' and
         hermes_legacy_patch_blobs.results[0].stdout == '6fa778e1cfbf584f950b627be633a08fbd10a841' and
         hermes_legacy_patch_blobs.results[2].stdout == '18c1e8b16f6e038b8ccf69f61ddd5c137d9a1fa9')
    fail_msg: >-
      The legacy Matrix customization differs from the reviewed source.
      Preserve and inspect the exact changes before any upgrade.
  when: hermes_checkout_status.stdout | trim != ''

- name: Look up the latest published stable Hermes release
  ansible.builtin.uri:
    url: https://api.github.com/repos/NousResearch/hermes-agent/releases/latest
    return_content: true
  register: hermes_latest_release
  changed_when: false
  check_mode: false

- name: Require the reviewed release to match upstream stable
  ansible.builtin.assert:
    that:
      - hermes_latest_release.json.tag_name == hermes_release_version
      - not hermes_latest_release.json.prerelease | bool
      - not hermes_latest_release.json.draft | bool
    fail_msg: >-
      A different stable Hermes release is now available. Review the
      update, adjust the pinned version through a PR, and retry.

- name: Resolve the reviewed annotated release tag to its exact upstream commit
  become_user: hermes
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --tags
      - https://github.com/NousResearch/hermes-agent.git
      - "refs/tags/{{ hermes_release_version }}^{}"
  register: hermes_upstream_tag_refs
  changed_when: false
  check_mode: false

- name: Extract the peeled release commit
  ansible.builtin.set_fact:
    hermes_expected_sha: "{{ hermes_upstream_tag_refs.stdout.split()[0] | default('') }}"

- name: Require an exact upstream release commit (not the annotated tag object)
  ansible.builtin.assert:
    that:
      - hermes_upstream_tag_refs.stdout_lines | length == 1
      - hermes_expected_sha is match('^[0-9a-f]{40}$')
      - hermes_upstream_tag_refs.stdout_lines[0].endswith('refs/tags/' ~ hermes_release_version ~ '^{}')
    fail_msg: Could not resolve the reviewed annotated Hermes release to its commit.

- name: Resolve the target the installed Hermes updater would select
  become_user: hermes
  environment:
    HOME: /home/hermes
    HERMES_HOME: /home/hermes/.hermes
  ansible.builtin.command:
    argv:
      - python3
      - -B
      - -c
      - >-
        from hermes_cli.source_releases import resolve_source_target;
        target = resolve_source_target('stable', repository='NousResearch/hermes-agent');
        assert target.commit, 'Stable channel has no published commit';
        print(target.commit)
    chdir: /home/hermes/.hermes/hermes-agent
  register: hermes_native_channel_sha
  changed_when: false
  check_mode: false

- name: Refuse a native stable-channel target different from the reviewed release
  ansible.builtin.assert:
    that:
      - hermes_native_channel_sha.stdout | trim == hermes_expected_sha
    fail_msg: >-
      The installed Hermes updater selects a different stable channel commit
      than the reviewed GitHub release. Stop before any source or state
      migration; update the plan or resolve the upstream channel discrepancy.

- name: Read Hermes service user ID
  ansible.builtin.command:
    argv: [id, -u, hermes]
  register: hermes_upgrade_uid
  changed_when: false
  check_mode: false

- name: Inspect the native Hermes update plan
  become_user: hermes
  environment:
    HOME: /home/hermes
    HERMES_HOME: /home/hermes/.hermes
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_upgrade_uid.stdout | trim }}"
  ansible.builtin.command:
    argv:
      - /home/hermes/.local/bin/hermes
      - update
      - --plan
      - --channel
      - stable
  register: hermes_native_update_plan
  changed_when: false
  check_mode: false

- name: Summarize the proposed Hermes transition
  ansible.builtin.debug:
    msg: >-
      Hermes {{ hermes_before_sha.stdout | trim }} to
      {{ hermes_release_version }} ({{ hermes_expected_sha }}).
      In check mode this is a preview only. Review the native plan,
      independent recovery and a recent protected backup before apply.

- name: Require explicit approval for a live Hermes version change
  ansible.builtin.assert:
    that:
      - hermes_update_reviewed | default(false) | bool
    fail_msg: Set hermes_update_reviewed=true only for the approved production upgrade.
  when:
    - not ansible_check_mode
    - hermes_before_sha.stdout | trim != hermes_expected_sha

- name: Run Hermes upstream stable updater with its own full pre-update backup
  become_user: hermes
  environment:
    HOME: /home/hermes
    HERMES_HOME: /home/hermes/.hermes
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_upgrade_uid.stdout | trim }}"
  ansible.builtin.command:
    argv:
      - /home/hermes/.local/bin/hermes
      - update
      - --channel
      - stable
      - --yes
      - --backup
      - --keep-stash
      - --no-gateway-restart
  async: 3600
  poll: 15
  changed_when: true
  when:
    - not ansible_check_mode
    - hermes_before_sha.stdout | trim != hermes_expected_sha

- name: Mark that the Hermes dashboard must load the new release
  ansible.builtin.set_fact:
    hermes_update_completed: "{{ hermes_before_sha.stdout | trim != hermes_expected_sha }}"
  when: not ansible_check_mode

- name: Read Hermes revision immediately after the native updater
  become_user: hermes
  ansible.builtin.command:
    argv:
      - git
      - -C
      - /home/hermes/.hermes/hermes-agent
      - rev-parse
      - HEAD
  register: hermes_post_update_revision
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Refuse to modify Matrix E2EE source on an unexpected Hermes revision
  ansible.builtin.assert:
    that:
      - hermes_post_update_revision.stdout | trim == hermes_expected_sha
    fail_msg: >-
      Hermes updater left the checkout at a different commit than the
      reviewed stable release. Inspect current checkout, stash and backups
      before any recovery action; do not re-run the updater.
  when: not ansible_check_mode

- name: Reconcile reviewed Matrix overlay after the native update
  ansible.builtin.import_tasks: matrix-overlay.yml
  when: not ansible_check_mode

- name: Verify installed Hermes after the native update
  ansible.builtin.import_tasks: release-verify.yml
  when: not ansible_check_mode

- name: Reconcile Hermes systemd units with the updated runtime lock
  ansible.builtin.import_tasks: runtime-units.yml
  when: not ansible_check_mode

- name: Require Hermes gateway and dashboard services active
  become_user: hermes
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_upgrade_uid.stdout | trim }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - "{{ item }}"
  loop:
    - hermes-gateway.service
    - hermes-dashboard.service
  register: hermes_update_service_status
  changed_when: false
  check_mode: false
