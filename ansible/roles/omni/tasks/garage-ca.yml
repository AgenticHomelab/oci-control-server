---
- name: Select the requested Compose CA mount state
  ansible.builtin.set_fact:
    omni_garage_ca_mount_enabled: "{{ omni_garage_ca_action == 'enable' }}"

- name: Inspect the verified Garage CA source on the controller
  ansible.builtin.stat:
    path: "{{ truenas_backup_ca_source }}"
    follow: false
  delegate_to: localhost
  become: false
  register: omni_garage_ca_source_file
  when: omni_garage_ca_action == 'enable'

- name: Require a regular public Garage CA source
  ansible.builtin.assert:
    that:
      - truenas_backup_ca_source | length > 0
      - omni_garage_ca_source_file.stat.isreg | default(false)
      - not (omni_garage_ca_source_file.stat.islnk | default(false))
      - omni_garage_ca_source_file.stat.mode == '0644'
    fail_msg: Select the verified public Garage CA certificate from the workstation cache.
  when: omni_garage_ca_action == 'enable'

- name: Inspect any existing Garage CA before preserving its trust state
  ansible.builtin.stat:
    path: /etc/oci-control-server/garage-backup-ca.pem
    follow: false
  register: omni_garage_ca_preexisting
  when: omni_garage_ca_action == 'enable'

- name: Require any existing Garage CA to remain a root-owned regular file
  ansible.builtin.assert:
    that:
      - >-
        not (omni_garage_ca_preexisting.stat.exists | default(false)) or
        (omni_garage_ca_preexisting.stat.isreg | default(false) and
         not (omni_garage_ca_preexisting.stat.islnk | default(false)) and
         omni_garage_ca_preexisting.stat.uid == 0 and
         omni_garage_ca_preexisting.stat.mode == '0644')
    fail_msg: An existing Garage CA file is unsafe; preserve and investigate it before activation.
  when: omni_garage_ca_action == 'enable'

- name: Read any existing Garage CA for protected byte comparison
  ansible.builtin.slurp:
    src: /etc/oci-control-server/garage-backup-ca.pem
  register: omni_garage_ca_preexisting_content
  no_log: true
  when:
    - omni_garage_ca_action == 'enable'
    - omni_garage_ca_preexisting.stat.exists | default(false)

- name: Refuse to replace a different installed Garage trust anchor
  ansible.builtin.assert:
    that:
      - >-
        not (omni_garage_ca_preexisting.stat.exists | default(false)) or
        (omni_garage_ca_preexisting_content.content | b64decode) ==
        lookup('ansible.builtin.file', truenas_backup_ca_source, rstrip=False)
    fail_msg: An installed Garage CA differs from the reviewed source; no trust file was changed.
  no_log: true
  when: omni_garage_ca_action == 'enable'

- name: Install the verified public Garage CA without changing the backup target
  ansible.builtin.copy:
    src: "{{ truenas_backup_ca_source }}"
    dest: /etc/oci-control-server/garage-backup-ca.pem
    owner: root
    group: root
    mode: '0644'
  when: omni_garage_ca_action == 'enable'

- name: Inspect the host public CA bundle without following symlinks
  ansible.builtin.stat:
    path: /etc/ssl/certs/ca-certificates.crt
    follow: false
  register: omni_public_ca_bundle
  when: omni_garage_ca_action == 'enable'

- name: Require the root-owned public CA bundle used by the host
  ansible.builtin.assert:
    that:
      - omni_public_ca_bundle.stat.isreg | default(false)
      - not (omni_public_ca_bundle.stat.islnk | default(false))
      - omni_public_ca_bundle.stat.uid == 0
      - omni_public_ca_bundle.stat.mode == '0644'
    fail_msg: The standard host public CA bundle is missing or unsafe.
  when: omni_garage_ca_action == 'enable'

- name: Inspect the installed Garage root CA without following symlinks
  ansible.builtin.stat:
    path: /etc/oci-control-server/garage-backup-ca.pem
    follow: false
  register: omni_garage_ca_file
  when: omni_garage_ca_action == 'enable'

- name: Require the verified root-owned public Garage CA
  ansible.builtin.assert:
    that:
      - >-
        (omni_garage_ca_file.stat.isreg | default(false) and
         not (omni_garage_ca_file.stat.islnk | default(false)) and
         omni_garage_ca_file.stat.uid == 0 and
         omni_garage_ca_file.stat.mode == '0644') or
        (ansible_check_mode and not (omni_garage_ca_file.stat.exists | default(false)))
    fail_msg: The installed Garage CA must be a root-owned mode-0644 public certificate.
  when: omni_garage_ca_action == 'enable'

- name: Inspect the requested rollback Compose file without following symlinks
  ansible.builtin.stat:
    path: "{{ omni_garage_ca_rollback_source }}"
    follow: false
  register: omni_garage_rollback_file
  when: omni_garage_ca_action == 'rollback'

- name: Require a private rollback file created by this scoped procedure
  ansible.builtin.assert:
    that:
      - omni_garage_ca_rollback_source is match('^/var/lib/oci-control-server/omni-compose-rollback/compose-[0-9TZ]+[.]yaml$')
      - omni_garage_rollback_file.stat.isreg | default(false)
      - not (omni_garage_rollback_file.stat.islnk | default(false))
      - omni_garage_rollback_file.stat.uid == 0
      - omni_garage_rollback_file.stat.mode == '0600'
    fail_msg: Select one root-only Compose backup created by this scoped procedure.
  when: omni_garage_ca_action == 'rollback'

- name: Inspect Omni and Dex containers before the scoped recreation
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{{ "{{" }}.Config.Image{{ "}}" }}|{{ "{{" }}.State.Status{{ "}}" }}'
      - omni
  register: omni_garage_before
  changed_when: false
  check_mode: false

- name: Inspect the existing Dex container identity
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{{ "{{" }}.Id{{ "}}" }}'
      - dex
  register: omni_garage_dex_before
  changed_when: false
  check_mode: false

- name: Require the expected running Omni version before changing its Compose file
  ansible.builtin.assert:
    that:
      - omni_garage_before.stdout.split('|')[:2] == ['ghcr.io/siderolabs/omni:' ~ omni_version, 'running']
    fail_msg: Current Omni image or state differs from the reviewed migration baseline.

- name: Inspect the current public CA bundle mount
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{{ "{{" }}range .Mounts{{ "}}" }}{{ "{{" }}if eq .Destination "/etc/ssl/certs/ca-certificates.crt"{{ "}}" }}{{ "{{" }}.Source{{ "}}" }}|{{ "{{" }}.RW{{ "}}" }}{{ "{{" }}end{{ "}}" }}{{ "{{" }}end{{ "}}" }}'
      - omni
  register: omni_garage_public_mount_before
  changed_when: false
  check_mode: false

- name: Inspect the current Garage root CA mount
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{{ "{{" }}range .Mounts{{ "}}" }}{{ "{{" }}if eq .Destination "/etc/ssl/certs/garage-backup-ca.pem"{{ "}}" }}{{ "{{" }}.Source{{ "}}" }}|{{ "{{" }}.RW{{ "}}" }}{{ "{{" }}end{{ "}}" }}{{ "{{" }}end{{ "}}" }}'
      - omni
  register: omni_garage_private_mount_before
  changed_when: false
  check_mode: false

- name: Compare currently mounted CA bytes before skipping an Omni recreation
  ansible.builtin.shell: >-
    set -o pipefail;
    docker cp omni:/etc/ssl/certs/garage-backup-ca.pem - |
    tar --extract --to-stdout --file=- |
    cmp --silent - /etc/oci-control-server/garage-backup-ca.pem
  args:
    executable: /bin/bash
  register: omni_garage_current_ca_check
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - omni_garage_ca_action == 'enable'
    - omni_garage_public_mount_before.stdout == '/etc/ssl/certs/ca-certificates.crt|false'
    - omni_garage_private_mount_before.stdout == '/etc/oci-control-server/garage-backup-ca.pem|false'

- name: Compare mounted public CA bundle bytes before skipping an Omni recreation
  ansible.builtin.shell: >-
    set -o pipefail;
    docker cp omni:/etc/ssl/certs/ca-certificates.crt - |
    tar --extract --to-stdout --file=- |
    cmp --silent - /etc/ssl/certs/ca-certificates.crt
  args:
    executable: /bin/bash
  register: omni_garage_public_ca_check
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - omni_garage_ca_action == 'enable'
    - omni_garage_public_mount_before.stdout == '/etc/ssl/certs/ca-certificates.crt|false'
    - omni_garage_private_mount_before.stdout == '/etc/oci-control-server/garage-backup-ca.pem|false'

- name: Read current Omni Compose state for safe enable and rollback decisions
  ansible.builtin.slurp:
    src: /opt/omni/compose.yaml
  register: omni_garage_compose_before
  changed_when: false
  check_mode: false
  no_log: true

- name: Read only Omni's declared Compose volumes
  ansible.builtin.set_fact:
    omni_garage_compose_volumes_before: >-
      {{ (omni_garage_compose_before.content | b64decode | from_yaml).get('services', {}).get('omni', {}).get('volumes', []) }}
  no_log: true

- name: Decide whether Compose CA state differs from the request
  ansible.builtin.set_fact:
    omni_garage_compose_update_needed: >-
      {{ (omni_garage_ca_action == 'enable' and
          (omni_garage_compose_volumes_before.count('/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro') != 1 or
           omni_garage_compose_volumes_before.count('/etc/oci-control-server/garage-backup-ca.pem:/etc/ssl/certs/garage-backup-ca.pem:ro') != 1)) or
         (omni_garage_ca_action == 'rollback' and
          (omni_garage_compose_volumes_before.count('/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro') > 0 or
           omni_garage_compose_volumes_before.count('/etc/oci-control-server/garage-backup-ca.pem:/etc/ssl/certs/garage-backup-ca.pem:ro') > 0)) }}

- name: Decide whether the running Omni CA mount differs from the requested state
  ansible.builtin.set_fact:
    omni_garage_recreation_needed: >-
      {{ (omni_garage_ca_action == 'enable' and
          (omni_garage_public_mount_before.stdout != '/etc/ssl/certs/ca-certificates.crt|false' or
           omni_garage_private_mount_before.stdout != '/etc/oci-control-server/garage-backup-ca.pem|false' or
           (omni_garage_current_ca_check.rc | default(1)) != 0 or
           (omni_garage_public_ca_check.rc | default(1)) != 0)) or
         (omni_garage_ca_action == 'rollback' and
          (omni_garage_public_mount_before.stdout != '' or omni_garage_private_mount_before.stdout != '')) }}

- name: Decide whether any Omni CA or Compose change is required
  ansible.builtin.set_fact:
    omni_garage_ca_operation_needed: >-
      {{ (omni_garage_recreation_needed | bool) or (omni_garage_compose_update_needed | bool) }}

- name: Preserve a private rollback copy of the current Omni Compose file
  block:
    - name: Create a root-only Compose rollback directory
      ansible.builtin.file:
        path: /var/lib/oci-control-server/omni-compose-rollback
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Set a unique rollback path
      ansible.builtin.set_fact:
        omni_garage_compose_rollback: >-
          /var/lib/oci-control-server/omni-compose-rollback/compose-{{ ansible_date_time.iso8601_basic_short }}.yaml

    - name: Save the exact current Compose file
      ansible.builtin.copy:
        src: /opt/omni/compose.yaml
        dest: '{{ omni_garage_compose_rollback }}'
        remote_src: true
        owner: root
        group: root
        mode: '0600'
        force: false
      when: not ansible_check_mode

    - name: Render, validate and activate the opt-in CA mount
      block:
        - name: Render the reviewed Omni Compose template
          ansible.builtin.template:
            src: compose.yaml.j2
            dest: /opt/omni/compose.yaml
            owner: root
            group: root
            mode: '0640'
          when: omni_garage_ca_action == 'enable'

        - name: Restore the selected Compose file for rollback
          ansible.builtin.copy:
            src: "{{ omni_garage_ca_rollback_source }}"
            dest: /opt/omni/compose.yaml
            remote_src: true
            owner: root
            group: root
            mode: '0640'
          when: omni_garage_ca_action == 'rollback'

        - name: Validate Compose without displaying rendered environment
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - /opt/omni
              - --env-file
              - /opt/omni/.env
              - config
              - --quiet
          changed_when: false
          check_mode: false
          no_log: true
          when: not ansible_check_mode

        - name: Mark the point after which Omni-only rollback recreation is needed
          ansible.builtin.set_fact:
            omni_garage_recreation_started: true
          when:
            - not ansible_check_mode
            - omni_garage_recreation_needed | bool

        - name: Recreate only the Omni container
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - /opt/omni
              - --env-file
              - /opt/omni/.env
              - up
              - -d
              - --no-deps
              - --force-recreate
              - omni
          changed_when: true
          when:
            - not ansible_check_mode
            - omni_garage_recreation_needed | bool

        - name: Inspect Omni image and running state
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --format
              - '{{ "{{" }}.Config.Image{{ "}}" }}|{{ "{{" }}.State.Status{{ "}}" }}'
              - omni
          register: omni_garage_after
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: Require the expected image and running state
          ansible.builtin.assert:
            that:
              - omni_garage_after.stdout == 'ghcr.io/siderolabs/omni:' ~ omni_version ~ '|running'
            fail_msg: Omni image or running state differs from the requested result.
          when:
            - not ansible_check_mode

        - name: Inspect the activated public CA bundle mount
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --format
              - '{{ "{{" }}range .Mounts{{ "}}" }}{{ "{{" }}if eq .Destination "/etc/ssl/certs/ca-certificates.crt"{{ "}}" }}{{ "{{" }}.Source{{ "}}" }}|{{ "{{" }}.RW{{ "}}" }}{{ "{{" }}end{{ "}}" }}{{ "{{" }}end{{ "}}" }}'
              - omni
          register: omni_garage_public_mount_after
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: Inspect the activated Garage root CA mount
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --format
              - '{{ "{{" }}range .Mounts{{ "}}" }}{{ "{{" }}if eq .Destination "/etc/ssl/certs/garage-backup-ca.pem"{{ "}}" }}{{ "{{" }}.Source{{ "}}" }}|{{ "{{" }}.RW{{ "}}" }}{{ "{{" }}end{{ "}}" }}{{ "{{" }}end{{ "}}" }}'
              - omni
          register: omni_garage_private_mount_after
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: Require both verified CA mounts to be read-only
          ansible.builtin.assert:
            that:
              - omni_garage_public_mount_after.stdout == ('/etc/ssl/certs/ca-certificates.crt|false' if omni_garage_ca_action == 'enable' else '')
              - omni_garage_private_mount_after.stdout == ('/etc/oci-control-server/garage-backup-ca.pem|false' if omni_garage_ca_action == 'enable' else '')
            fail_msg: Omni public or Garage CA mount differs from the requested state.
          when: not ansible_check_mode

        - name: Compare the mounted Garage CA with the verified host CA
          ansible.builtin.shell: >-
            set -o pipefail;
            docker cp omni:/etc/ssl/certs/garage-backup-ca.pem - |
            tar --extract --to-stdout --file=- |
            cmp --silent - /etc/oci-control-server/garage-backup-ca.pem
          args:
            executable: /bin/bash
          changed_when: false
          check_mode: false
          when:
            - not ansible_check_mode
            - omni_garage_ca_action == 'enable'

        - name: Compare the mounted public CA bundle with the host bundle
          ansible.builtin.shell: >-
            set -o pipefail;
            docker cp omni:/etc/ssl/certs/ca-certificates.crt - |
            tar --extract --to-stdout --file=- |
            cmp --silent - /etc/ssl/certs/ca-certificates.crt
          args:
            executable: /bin/bash
          changed_when: false
          check_mode: false
          when:
            - not ansible_check_mode
            - omni_garage_ca_action == 'enable'

        - name: Inspect the Dex container identity after Omni recreation
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --format
              - '{{ "{{" }}.Id{{ "}}" }}'
              - dex
          register: omni_garage_dex_after
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: Require Dex to remain untouched
          ansible.builtin.assert:
            that:
              - omni_garage_dex_after.stdout == omni_garage_dex_before.stdout
            fail_msg: Dex identity changed during the Omni-only CA operation.
          when: not ansible_check_mode

      rescue:
        - name: Restore the exact prior Compose file after activation failure
          ansible.builtin.copy:
            src: '{{ omni_garage_compose_rollback }}'
            dest: /opt/omni/compose.yaml
            remote_src: true
            owner: root
            group: root
            mode: '0640'
          when:
            - not ansible_check_mode
            - omni_garage_compose_rollback is defined

        - name: Recreate only Omni from the restored Compose file
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - /opt/omni
              - --env-file
              - /opt/omni/.env
              - up
              - -d
              - --no-deps
              - --force-recreate
              - omni
          when:
            - not ansible_check_mode
            - omni_garage_recreation_started | default(false) | bool

        - name: Report CA activation failure after rollback
          ansible.builtin.fail:
            msg: >-
              Garage CA activation failed. The previous Compose file was restored;
              verify Omni service health and the saved rollback copy before retrying.
  when: omni_garage_ca_operation_needed | bool

- name: Print the rollback Compose path after successful activation
  ansible.builtin.debug:
    msg: "omni_garage_ca_rollback_source={{ omni_garage_compose_rollback }}"
  when:
    - not ansible_check_mode
    - omni_garage_compose_rollback is defined
