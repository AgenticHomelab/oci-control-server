---
- name: Require supported native host and root filesystem headroom
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '26.04'
      - ansible_facts['architecture'] == 'aarch64'
      - ansible_facts['service_mgr'] == 'systemd'
      - loki_version == '3.7.8'
      - loki_archive_sha256 is match('^[a-f0-9]{64}$')
      - (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first).size_available | int > loki_min_free_bytes | int

- name: Install archive prerequisite without package service restarts
  ansible.builtin.apt:
    name: unzip
    state: present
    policy_rc_d: 101

- name: Create Loki group
  ansible.builtin.group:
    name: loki
    system: true

- name: Create unprivileged Loki identity
  ansible.builtin.user:
    name: loki
    group: loki
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/loki
    create_home: false

- name: Create Loki directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - {path: "/opt/loki/{{ loki_version }}", owner: root, group: root, mode: "0755"}
    - {path: /etc/loki, owner: root, group: loki, mode: "0750"}
    - {path: /var/lib/loki, owner: loki, group: loki, mode: "0750"}

- name: Download checksum-pinned official Loki ARM64 archive
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-arm64.zip"
    checksum: "sha256:{{ loki_archive_sha256 }}"
    dest: "/opt/loki/{{ loki_version }}/release.zip"
    owner: root
    group: root
    mode: "0644"
    timeout: 60
  register: loki_download
  until: loki_download is succeeded
  retries: 3
  delay: 5

- name: Extract versioned official Loki binary
  ansible.builtin.unarchive:
    src: "/opt/loki/{{ loki_version }}/release.zip"
    dest: "/opt/loki/{{ loki_version }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    creates: "/opt/loki/{{ loki_version }}/loki-linux-arm64"
  notify: Restart Loki

- name: Validate and install native Loki configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/loki/config.yml
    owner: root
    group: loki
    mode: "0640"
    validate: "/opt/loki/{{ loki_version }}/loki-linux-arm64 -config.file=%s -verify-config=true"
  notify: Restart Loki

- name: Install restricted native Loki unit
  ansible.builtin.template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Loki

- name: Apply Loki handler before readiness
  ansible.builtin.meta: flush_handlers

- name: Enable and start only Loki
  ansible.builtin.systemd_service:
    name: loki
    enabled: true
    state: started

- name: Require Loki readiness
  ansible.builtin.import_tasks: ready.yml
