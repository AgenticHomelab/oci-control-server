---
- name: Validate nginx before reload
  listen: Reload nginx safely
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Reload nginx
  listen: Reload nginx safely
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Validate nginx before restart
  listen: Restart nginx safely
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Reload systemd manager for nginx
  listen: Restart nginx safely
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart nginx
  listen: Restart nginx safely
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
