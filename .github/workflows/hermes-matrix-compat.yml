name: Verify Hermes Matrix E2EE compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - ansible/group_vars/all/versions.yml
      - ansible/roles/hermes/files/matrix/**
      - ansible/roles/hermes/tasks/matrix-overlay.yml
      - .github/workflows/hermes-matrix-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Fetch exactly the reviewed stable Hermes release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^hermes_release_version: "\(v[^"]*\)"/\1/p' ansible/group_vars/all/versions.yml)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git clone --depth 1 --branch "$version" \
            https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" describe --tags --exact-match)" = "$version"
      - name: Verify adapter patch against upstream release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hermes-agent"
          git apply --check "$GITHUB_WORKSPACE/ansible/roles/hermes/files/matrix/adapter-v0.23.4.patch"
          git apply "$GITHUB_WORKSPACE/ansible/roles/hermes/files/matrix/adapter-v0.23.4.patch"
          cp "$GITHUB_WORKSPACE/ansible/roles/hermes/files/matrix/direct_key_delivery.py" \
             plugins/platforms/matrix/direct_key_delivery.py
          cp "$GITHUB_WORKSPACE/ansible/roles/hermes/files/matrix/test_matrix_direct_key_delivery.py" \
             tests/gateway/test_matrix_direct_key_delivery.py
      - name: Install native Matrix crypto without unrelated Hermes dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'mautrix[encryption]==0.21.1' pytest pytest-asyncio
          python -c 'import mautrix.crypto, olm'
      - name: Run isolated real-crypto regressions
        shell: bash
        run: |
          set -euo pipefail
          # The upstream package initializer imports the full Hermes gateway.
          # Avoid it for these SDK-level tests; adapter integration is still
          # a separate, mandatory production acceptance check.
          printf '# isolated SDK test package\n' > "$RUNNER_TEMP/hermes-agent/plugins/platforms/matrix/__init__.py"
          mkdir -p "$RUNNER_TEMP/matrix-tests"
          cp "$RUNNER_TEMP/hermes-agent/tests/gateway/test_matrix_direct_key_delivery.py" \
            "$RUNNER_TEMP/matrix-tests/test_matrix_direct_key_delivery.py"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/hermes-agent" python -m pytest \
            -c /dev/null -q matrix-tests/test_matrix_direct_key_delivery.py \
            -k 'not yaml_adapter and not unconfigured_adapter'
